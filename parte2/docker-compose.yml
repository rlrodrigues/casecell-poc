services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ShopDb: "Data Source=/app/data/casecellshop.db"
      ConnectionStrings__Redis: "redis:6379"
      Erp__BillingDelayMs: 500
    depends_on:
      redis:
        condition: service_started
    volumes:
      - casecellshop-data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  casecellshop-data:
