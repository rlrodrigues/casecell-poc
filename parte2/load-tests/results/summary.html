<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CaseCellShop - Relatório k6</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color: #1f2937; }
    .card { border: 1px solid #d8dde8; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: #f7f8fb; border: 1px solid #d8dde8; border-radius: 8px; padding: 16px; }
    .value { font-size: 28px; font-weight: 700; }
    .label { font-size: 14px; fill: #1f2937; }
  </style>
</head>
<body>
  <h1>CaseCellShop - Relatório de carga k6</h1>
  <p>Resumo gerado automaticamente a partir do teste de carga.</p>
  <div class="grid">
    <div class="stat"><div>Total requests</div><div class="value">1661</div></div>
    <div class="stat"><div>Products p95</div><div class="value">48 ms</div></div>
    <div class="stat"><div>Checkout p95</div><div class="value">23 ms</div></div>
    <div class="stat"><div>Fail rate</div><div class="value">0.00%</div></div>
  </div>
  <div class="card">
    <h2>Gráfico de metas</h2>
    <svg width="960" height="285" role="img" aria-label="Comparação das métricas de carga com metas">
      
      <text x="20" y="40" class="label">Products p95 ms: 48.02</text>
      <rect x="220" y="22" width="700" height="24" fill="#eef2f7" rx="4"></rect>
      <rect x="220" y="22" width="67" height="24" fill="#2f6f9f" rx="4"></rect>
      <line x1="920" y1="18" x2="920" y2="50" stroke="#b42318" stroke-width="2"></line>
      <text x="20" y="98" class="label">Checkout p95 ms: 22.59</text>
      <rect x="220" y="80" width="700" height="24" fill="#eef2f7" rx="4"></rect>
      <rect x="220" y="80" width="18" height="24" fill="#2f6f9f" rx="4"></rect>
      <line x1="920" y1="76" x2="920" y2="108" stroke="#b42318" stroke-width="2"></line>
      <text x="20" y="156" class="label">Fail rate %: 0.00</text>
      <rect x="220" y="138" width="700" height="24" fill="#eef2f7" rx="4"></rect>
      <rect x="220" y="138" width="0" height="24" fill="#2f6f9f" rx="4"></rect>
      <line x1="920" y1="134" x2="920" y2="166" stroke="#b42318" stroke-width="2"></line>
      <text x="20" y="214" class="label">Checkout accepted %: 100.00</text>
      <rect x="220" y="196" width="700" height="24" fill="#eef2f7" rx="4"></rect>
      <rect x="220" y="196" width="700" height="24" fill="#2f6f9f" rx="4"></rect>
      <line x1="920" y1="192" x2="920" y2="224" stroke="#b42318" stroke-width="2"></line>
    </svg>
  </div>
</body>
</html>
