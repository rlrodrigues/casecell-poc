<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura orientada a dominios</title>
  <desc id="desc">Arquitetura futura com dominios de catalogo, precos, estoque e checkout, cada um com banco proprio, integrados por eventos e por gateway.</desc>
  <defs>
    <style>
      .bg { fill: #f7faf7; }
      .lane { fill: #ffffff; stroke: #d5dbe7; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #44546a; stroke-width: 1.8; rx: 8; }
      .svc { fill: #eef6ff; stroke: #2f6f9f; }
      .db { fill: #fff7e8; stroke: #9a6700; }
      .event { fill: #edf8f1; stroke: #277a43; }
      .erp { fill: #f7eef8; stroke: #884a91; }
      .obs { fill: #f1f3f7; stroke: #667085; }
      .title { font: 700 28px Arial, sans-serif; fill: #182230; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475467; }
      .laneTitle { font: 700 16px Arial, sans-serif; fill: #344054; }
      .label { font: 700 16px Arial, sans-serif; fill: #182230; }
      .small { font: 13px Arial, sans-serif; fill: #475467; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.1; marker-end: url(#arrow); }
      .eventLine { fill: none; stroke: #277a43; stroke-width: 2.1; marker-end: url(#arrowGreen); }
      .dashed { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#277a43"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="760"/>
  <text class="title" x="48" y="50">Opcao 2: plataforma de comercio orientada a dominios</text>
  <text class="subtitle" x="48" y="78">Mais robusta para longo prazo, com maior isolamento entre dominios e maior custo operacional.</text>

  <rect class="lane" x="40" y="112" width="230" height="560" rx="14"/>
  <rect class="lane" x="300" y="112" width="510" height="560" rx="14"/>
  <rect class="lane" x="840" y="112" width="210" height="560" rx="14"/>
  <rect class="lane" x="1080" y="112" width="200" height="560" rx="14"/>

  <text class="laneTitle" x="64" y="144">Entrada</text>
  <text class="laneTitle" x="324" y="144">Dominios da loja</text>
  <text class="laneTitle" x="864" y="144">Eventos</text>
  <text class="laneTitle" x="1104" y="144">ERP</text>

  <rect class="box svc" x="84" y="214" width="142" height="70"/>
  <text class="label" x="129" y="244">Cliente</text>
  <text class="small" x="112" y="266">web / app</text>

  <rect class="box svc" x="84" y="386" width="142" height="78"/>
  <text class="label" x="108" y="418">API Gateway</text>
  <text class="small" x="111" y="440">BFF / contratos</text>

  <rect class="box svc" x="344" y="174" width="170" height="58"/>
  <text class="label" x="398" y="209">Catalogo</text>
  <rect class="box db" x="584" y="174" width="170" height="58"/>
  <text class="label" x="620" y="209">DB Catalogo</text>

  <rect class="box svc" x="344" y="286" width="170" height="58"/>
  <text class="label" x="407" y="321">Precos</text>
  <rect class="box db" x="584" y="286" width="170" height="58"/>
  <text class="label" x="629" y="321">DB Precos</text>

  <rect class="box svc" x="344" y="398" width="170" height="58"/>
  <text class="label" x="403" y="433">Estoque</text>
  <rect class="box db" x="584" y="398" width="170" height="58"/>
  <text class="label" x="625" y="433">DB Estoque</text>

  <rect class="box svc" x="344" y="510" width="170" height="58"/>
  <text class="label" x="400" y="545">Checkout</text>
  <rect class="box db" x="584" y="510" width="170" height="58"/>
  <text class="label" x="626" y="545">DB Pedidos</text>

  <rect class="box event" x="872" y="240" width="146" height="78"/>
  <text class="label" x="890" y="272">Event Broker</text>
  <text class="small" x="891" y="294">RabbitMQ / Kafka</text>

  <rect class="box event" x="872" y="430" width="146" height="78"/>
  <text class="label" x="899" y="462">Worker ERP</text>
  <text class="small" x="904" y="484">faturamento</text>

  <rect class="box obs" x="872" y="574" width="146" height="58"/>
  <text class="label" x="889" y="609">Observabilidade</text>

  <rect class="box erp" x="1112" y="244" width="136" height="74"/>
  <text class="label" x="1144" y="275">API ERP</text>
  <text class="small" x="1129" y="297">financeiro / fiscal</text>

  <rect class="box erp" x="1112" y="430" width="136" height="74"/>
  <text class="label" x="1141" y="462">Base ERP</text>
  <text class="small" x="1130" y="484">legado central</text>

  <path class="arrow" d="M155 284 L155 386"/>
  <path class="arrow" d="M226 425 L300 425 L300 203 L344 203"/>
  <path class="arrow" d="M226 425 L300 425 L300 315 L344 315"/>
  <path class="arrow" d="M226 425 L344 425"/>
  <path class="arrow" d="M226 425 L300 425 L300 539 L344 539"/>

  <path class="arrow" d="M514 203 L584 203"/>
  <path class="arrow" d="M514 315 L584 315"/>
  <path class="arrow" d="M514 427 L584 427"/>
  <path class="arrow" d="M514 539 L584 539"/>

  <path class="eventLine" d="M754 203 L810 203 L810 279 L872 279"/>
  <path class="eventLine" d="M754 315 L810 315 L810 279 L872 279"/>
  <path class="eventLine" d="M754 427 L810 427 L810 279 L872 279"/>
  <path class="eventLine" d="M754 539 L810 539 L810 279 L872 279"/>

  <path class="eventLine" d="M945 318 L945 430"/>
  <path class="arrow" d="M1018 469 L1112 281"/>
  <path class="arrow" d="M1180 318 L1180 430"/>
  <path class="dashed" d="M1112 467 L1050 467 L1050 539 L754 539"/>
  <path class="dashed" d="M754 603 L872 603"/>

  <text class="small" x="242" y="407">rotas por dominio</text>
  <text class="small" x="772" y="262">eventos de dominio</text>
  <text class="small" x="1038" y="369">integracao isolada</text>
</svg>
