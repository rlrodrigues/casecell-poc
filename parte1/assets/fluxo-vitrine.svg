<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo da vitrine com cache</title>
  <desc id="desc">Fluxo de leitura da vitrine usando CDN, API da loja, Redis, banco da loja e sincronizacao com ERP.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .box { fill: #ffffff; stroke: #44546a; stroke-width: 1.8; rx: 8; }
      .client { fill: #eef6ff; stroke: #2f6f9f; }
      .cache { fill: #edf8f1; stroke: #277a43; }
      .data { fill: #fff7e8; stroke: #9a6700; }
      .erp { fill: #f7eef8; stroke: #884a91; }
      .note { fill: #ffffff; stroke: #d5dbe7; stroke-width: 1.4; rx: 8; }
      .title { font: 700 26px Arial, sans-serif; fill: #182230; }
      .label { font: 700 16px Arial, sans-serif; fill: #182230; }
      .small { font: 13px Arial, sans-serif; fill: #475467; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.1; marker-end: url(#arrow); }
      .green { fill: none; stroke: #277a43; stroke-width: 2.1; marker-end: url(#arrowGreen); }
      .dashed { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#277a43"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="560"/>
  <text class="title" x="48" y="48">Fluxo da vitrine</text>
  <text class="small" x="48" y="74">Cache acelera a leitura, mas a fonte de verdade operacional continua no banco da loja e no ERP sincronizado.</text>

  <rect class="box client" x="60" y="140" width="140" height="68"/>
  <text class="label" x="104" y="170">Cliente</text>
  <text class="small" x="92" y="190">web / app</text>

  <rect class="box client" x="260" y="140" width="140" height="68"/>
  <text class="label" x="298" y="170">CDN</text>
  <text class="small" x="288" y="190">edge cache</text>

  <rect class="box client" x="460" y="140" width="170" height="68"/>
  <text class="label" x="502" y="170">API da Loja</text>
  <text class="small" x="493" y="190">GET /products</text>

  <rect class="box cache" x="720" y="96" width="170" height="68"/>
  <text class="label" x="782" y="126">Redis</text>
  <text class="small" x="757" y="146">cache hit</text>

  <rect class="box data" x="720" y="232" width="170" height="78"/>
  <text class="label" x="756" y="263">Banco da Loja</text>
  <text class="small" x="748" y="285">read model atualizado</text>

  <rect class="box erp" x="970" y="232" width="150" height="78"/>
  <text class="label" x="1015" y="263">ERP</text>
  <text class="small" x="998" y="285">catalogo / estoque</text>

  <rect class="note" x="460" y="386" width="430" height="86"/>
  <text class="label" x="484" y="418">Politica de cache</text>
  <text class="small" x="484" y="442">TTL curto + jitter + invalidacao por SKU alterado.</text>
  <text class="small" x="484" y="462">Preco e disponibilidade exibidos podem ter pequena defasagem controlada.</text>

  <path class="arrow" d="M200 174 L260 174"/>
  <path class="arrow" d="M400 174 L460 174"/>
  <path class="green" d="M630 174 L675 174 L675 130 L720 130"/>
  <path class="green" d="M720 130 L675 130 L675 106 L130 106 L130 140"/>
  <path class="arrow" d="M630 174 L675 174 L675 271 L720 271"/>
  <path class="green" d="M805 232 L805 164"/>
  <path class="arrow" d="M720 271 L675 271 L675 338 L130 338 L130 208"/>
  <path class="dashed" d="M970 271 L890 271"/>
  <path class="dashed" d="M805 310 L805 386"/>

  <text class="small" x="642" y="116">1. tenta cache</text>
  <text class="small" x="640" y="255">2. cache miss</text>
  <text class="small" x="824" y="198">3. popula Redis</text>
  <text class="small" x="916" y="252">sincronizador</text>
  <text class="small" x="274" y="326">4. resposta ao cliente</text>
</svg>
