<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura pragmatica de transicao</title>
  <desc id="desc">Opcao recomendada para 30 a 90 dias, com ERP fora do caminho quente, cache Redis, banco da loja, outbox, RabbitMQ e worker de faturamento.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .lane { fill: #ffffff; stroke: #d5dbe7; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #44546a; stroke-width: 1.8; rx: 8; }
      .edge { fill: #eef6ff; stroke: #2f6f9f; }
      .data { fill: #fff7e8; stroke: #9a6700; }
      .async { fill: #edf8f1; stroke: #277a43; }
      .erp { fill: #f7eef8; stroke: #884a91; }
      .obs { fill: #f1f3f7; stroke: #667085; }
      .title { font: 700 28px Arial, sans-serif; fill: #182230; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475467; }
      .laneTitle { font: 700 16px Arial, sans-serif; fill: #344054; }
      .label { font: 700 16px Arial, sans-serif; fill: #182230; }
      .small { font: 13px Arial, sans-serif; fill: #475467; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1320" height="760"/>
  <text class="title" x="48" y="50">Opcao 1: arquitetura pragmatica de transicao</text>
  <text class="subtitle" x="48" y="78">A loja ganha autonomia para vitrine e checkout, enquanto o ERP permanece como sistema central de faturamento.</text>

  <rect class="lane" x="40" y="112" width="230" height="560" rx="14"/>
  <rect class="lane" x="300" y="112" width="420" height="560" rx="14"/>
  <rect class="lane" x="750" y="112" width="250" height="560" rx="14"/>
  <rect class="lane" x="1030" y="112" width="250" height="560" rx="14"/>

  <text class="laneTitle" x="64" y="144">Cliente e borda</text>
  <text class="laneTitle" x="324" y="144">Camada operacional da loja</text>
  <text class="laneTitle" x="774" y="144">Processamento assincrono</text>
  <text class="laneTitle" x="1054" y="144">ERP legado</text>

  <rect class="box edge" x="84" y="206" width="142" height="70"/>
  <text class="label" x="129" y="236">Cliente</text>
  <text class="small" x="112" y="258">web / app</text>

  <rect class="box edge" x="84" y="354" width="142" height="70"/>
  <text class="label" x="116" y="384">CDN / Edge</text>
  <text class="small" x="111" y="406">assets e cache</text>

  <rect class="box edge" x="346" y="196" width="290" height="78"/>
  <text class="label" x="430" y="228">API da Loja / BFF</text>
  <text class="small" x="384" y="250">vitrine, checkout, idempotencia</text>

  <rect class="box" x="346" y="326" width="290" height="74"/>
  <text class="label" x="468" y="358">Redis</text>
  <text class="small" x="395" y="380">catalogo, preco, disponibilidade exibida</text>

  <rect class="box data" x="346" y="466" width="290" height="86"/>
  <text class="label" x="432" y="499">Banco da Loja</text>
  <text class="small" x="381" y="521">read model, pedidos, reservas, status</text>

  <rect class="box data" x="346" y="592" width="290" height="54"/>
  <text class="label" x="463" y="625">Outbox</text>

  <rect class="box async" x="798" y="216" width="154" height="70"/>
  <text class="label" x="838" y="247">RabbitMQ</text>
  <text class="small" x="831" y="268">fila e DLQ</text>

  <rect class="box async" x="798" y="382" width="154" height="82"/>
  <text class="label" x="826" y="414">Worker de</text>
  <text class="label" x="812" y="436">faturamento</text>

  <rect class="box obs" x="798" y="558" width="154" height="66"/>
  <text class="label" x="819" y="588">Observabilidade</text>
  <text class="small" x="830" y="608">logs, metricas, traces</text>

  <rect class="box erp" x="1078" y="214" width="154" height="78"/>
  <text class="label" x="1119" y="246">API ERP</text>
  <text class="small" x="1100" y="268">faturamento</text>

  <rect class="box erp" x="1078" y="406" width="154" height="78"/>
  <text class="label" x="1116" y="438">Base ERP</text>
  <text class="small" x="1106" y="460">financeiro / fiscal</text>

  <path class="arrow" d="M155 276 L155 354"/>
  <path class="arrow" d="M226 389 L346 235"/>
  <path class="arrow" d="M491 274 L491 326"/>
  <path class="arrow" d="M491 400 L491 466"/>
  <path class="arrow" d="M491 552 L491 592"/>
  <path class="arrow" d="M636 619 L720 619 L720 251 L798 251"/>
  <path class="arrow" d="M875 286 L875 382"/>
  <path class="arrow" d="M952 423 L1078 253"/>
  <path class="arrow" d="M1155 292 L1155 406"/>
  <path class="dashed" d="M1078 445 L1000 445 L1000 508 L636 508"/>
  <path class="dashed" d="M636 363 L750 363 L750 591 L798 591"/>
  <path class="dashed" d="M952 423 L1000 423 L1000 591 L952 591"/>

  <text class="small" x="242" y="314">HTTP</text>
  <text class="small" x="506" y="307">cache read/write</text>
  <text class="small" x="506" y="444">reserva atomica</text>
  <text class="small" x="650" y="604">evento confirmado</text>
  <text class="small" x="982" y="331">chamada lenta isolada</text>
  <text class="small" x="850" y="530">telemetria</text>
</svg>
