<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de checkout assincrono</title>
  <desc id="desc">Fluxo de checkout com idempotencia, reserva transacional de estoque, outbox, publicacao em fila, faturamento no ERP e rastreabilidade de status.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .lane { fill: #ffffff; stroke: #d5dbe7; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #44546a; stroke-width: 1.8; rx: 8; }
      .api { fill: #eef6ff; stroke: #2f6f9f; }
      .tx { fill: #fff7e8; stroke: #9a6700; }
      .async { fill: #edf8f1; stroke: #277a43; }
      .erp { fill: #f7eef8; stroke: #884a91; }
      .warn { fill: #fff1f0; stroke: #b42318; }
      .title { font: 700 26px Arial, sans-serif; fill: #182230; }
      .laneTitle { font: 700 15px Arial, sans-serif; fill: #344054; }
      .label { font: 700 15px Arial, sans-serif; fill: #182230; }
      .small { font: 13px Arial, sans-serif; fill: #475467; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.1; marker-end: url(#arrow); }
      .event { fill: none; stroke: #277a43; stroke-width: 2.1; marker-end: url(#arrowGreen); }
      .dashed { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#277a43"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="620"/>
  <text class="title" x="48" y="48">Fluxo do checkout</text>
  <text class="small" x="48" y="74">O cliente recebe aceite rapido; faturamento no ERP fica desacoplado e rastreavel.</text>

  <rect class="lane" x="40" y="112" width="230" height="420" rx="12"/>
  <rect class="lane" x="300" y="112" width="360" height="420" rx="12"/>
  <rect class="lane" x="690" y="112" width="250" height="420" rx="12"/>
  <rect class="lane" x="970" y="112" width="260" height="420" rx="12"/>

  <text class="laneTitle" x="64" y="142">Cliente</text>
  <text class="laneTitle" x="324" y="142">Transacao local</text>
  <text class="laneTitle" x="714" y="142">Mensageria</text>
  <text class="laneTitle" x="994" y="142">Faturamento externo</text>

  <rect class="box api" x="84" y="206" width="142" height="70"/>
  <text class="label" x="111" y="236">POST /checkout</text>
  <text class="small" x="106" y="258">Idempotency-Key</text>

  <rect class="box tx" x="336" y="168" width="286" height="64"/>
  <text class="label" x="389" y="198">1. Valida idempotencia</text>
  <text class="small" x="370" y="218">mesma chave retorna mesmo pedido</text>

  <rect class="box tx" x="336" y="262" width="286" height="70"/>
  <text class="label" x="392" y="292">2. Reserva estoque</text>
  <text class="small" x="374" y="314">UPDATE condicional: available &gt;= qtd</text>

  <rect class="box tx" x="336" y="364" width="286" height="78"/>
  <text class="label" x="391" y="394">3. Cria pedido + outbox</text>
  <text class="small" x="364" y="416">pedido, status, reserva e evento no mesmo commit</text>

  <rect class="box async" x="728" y="188" width="174" height="70"/>
  <text class="label" x="766" y="218">Publisher</text>
  <text class="small" x="750" y="240">le outbox e publica</text>

  <rect class="box async" x="728" y="326" width="174" height="70"/>
  <text class="label" x="773" y="356">RabbitMQ</text>
  <text class="small" x="769" y="378">fila principal</text>

  <rect class="box erp" x="1010" y="188" width="174" height="70"/>
  <text class="label" x="1049" y="218">Worker ERP</text>
  <text class="small" x="1031" y="240">retry com backoff</text>

  <rect class="box erp" x="1010" y="326" width="174" height="70"/>
  <text class="label" x="1061" y="356">API ERP</text>
  <text class="small" x="1048" y="378">faturamento lento</text>

  <rect class="box warn" x="1010" y="452" width="174" height="54"/>
  <text class="label" x="1072" y="484">DLQ</text>

  <path class="arrow" d="M226 241 L336 200"/>
  <path class="arrow" d="M479 232 L479 262"/>
  <path class="arrow" d="M479 332 L479 364"/>
  <path class="arrow" d="M336 403 L254 403 L254 276"/>
  <path class="event" d="M622 403 L660 403 L660 223 L728 223"/>
  <path class="event" d="M815 258 L815 326"/>
  <path class="event" d="M902 361 L970 361 L970 223 L1010 223"/>
  <path class="arrow" d="M1097 258 L1097 326"/>
  <path class="dashed" d="M1010 361 L940 361 L940 403 L622 403"/>
  <path class="dashed" d="M1097 396 L1097 452"/>

  <text class="small" x="184" y="388">202 Accepted + orderId</text>
  <text class="small" x="640" y="206">evento OrderCreated</text>
  <text class="small" x="950" y="418">atualiza status</text>
  <text class="small" x="1112" y="430">erro permanente</text>
</svg>
