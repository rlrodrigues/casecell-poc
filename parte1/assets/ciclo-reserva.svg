<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de vida da reserva de estoque</title>
  <desc id="desc">Estados possiveis de uma reserva de estoque: criada, confirmada, expirada, cancelada e liberada.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .state { fill: #ffffff; stroke: #44546a; stroke-width: 1.8; rx: 8; }
      .start { fill: #eef6ff; stroke: #2f6f9f; }
      .hold { fill: #fff7e8; stroke: #9a6700; }
      .ok { fill: #edf8f1; stroke: #277a43; }
      .end { fill: #f1f3f7; stroke: #667085; }
      .bad { fill: #fff1f0; stroke: #b42318; }
      .title { font: 700 24px Arial, sans-serif; fill: #182230; }
      .label { font: 700 16px Arial, sans-serif; fill: #182230; }
      .small { font: 13px Arial, sans-serif; fill: #475467; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.1; marker-end: url(#arrow); }
      .release { fill: none; stroke: #667085; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="420"/>
  <text class="title" x="48" y="48">Ciclo de vida da reserva</text>
  <text class="small" x="48" y="74">A reserva evita overselling porque reduz o saldo disponivel dentro da transacao de checkout.</text>

  <rect class="state start" x="70" y="172" width="150" height="72"/>
  <text class="label" x="111" y="202">Disponivel</text>
  <text class="small" x="100" y="224">available &gt;= qtd</text>

  <rect class="state hold" x="300" y="172" width="150" height="72"/>
  <text class="label" x="333" y="202">Reservado</text>
  <text class="small" x="326" y="224">pedido aceito</text>

  <rect class="state ok" x="570" y="86" width="150" height="72"/>
  <text class="label" x="618" y="116">Confirmado</text>
  <text class="small" x="604" y="138">ERP faturou</text>

  <rect class="state bad" x="570" y="172" width="150" height="72"/>
  <text class="label" x="616" y="202">Expirado</text>
  <text class="small" x="595" y="224">timeout / abandono</text>

  <rect class="state bad" x="570" y="258" width="150" height="72"/>
  <text class="label" x="613" y="288">Cancelado</text>
  <text class="small" x="595" y="310">falha permanente</text>

  <rect class="state end" x="800" y="215" width="150" height="72"/>
  <text class="label" x="840" y="245">Liberado</text>
  <text class="small" x="826" y="267">devolve saldo</text>

  <path class="arrow" d="M220 208 L300 208"/>
  <path class="arrow" d="M450 208 L510 208 L510 122 L570 122"/>
  <path class="arrow" d="M450 208 L570 208"/>
  <path class="arrow" d="M450 208 L510 208 L510 294 L570 294"/>
  <path class="release" d="M720 208 L760 208 L760 251 L800 251"/>
  <path class="release" d="M720 294 L760 294 L760 251 L800 251"/>

  <text class="small" x="235" y="196">update atomico</text>
  <text class="small" x="470" y="107">sucesso</text>
  <text class="small" x="470" y="194">TTL venceu</text>
  <text class="small" x="470" y="278">cancelamento</text>
</svg>
