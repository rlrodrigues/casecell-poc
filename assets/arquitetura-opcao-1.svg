<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura pragmática em 30 a 90 dias</title>
  <desc id="desc">Diagrama da arquitetura recomendada com API da loja, cache, banco próprio, outbox, RabbitMQ, worker e ERP.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .band { fill: #ffffff; stroke: #d8dde8; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #56657a; stroke-width: 2; rx: 10; }
      .accent { fill: #eef6ff; stroke: #2f6f9f; }
      .data { fill: #fff7e8; stroke: #996515; }
      .queue { fill: #edf8f0; stroke: #2d7a46; }
      .erp { fill: #f7eef8; stroke: #8a4a94; }
      .obs { fill: #f1f2f5; stroke: #6a7280; }
      .title { font: 700 28px Arial, sans-serif; fill: #1c2430; }
      .label { font: 700 18px Arial, sans-serif; fill: #1c2430; }
      .small { font: 14px Arial, sans-serif; fill: #39465a; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2.3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #6a7280; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6a7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="54">Opção 1: arquitetura pragmática de transição</text>
  <text class="small" x="48" y="82">ERP permanece como sistema central, mas sai do caminho quente da vitrine e do checkout.</text>

  <rect class="band" x="40" y="116" width="260" height="540" rx="14"/>
  <rect class="band" x="340" y="116" width="360" height="540" rx="14"/>
  <rect class="band" x="740" y="116" width="240" height="540" rx="14"/>
  <rect class="band" x="1020" y="116" width="220" height="540" rx="14"/>

  <text class="label" x="66" y="150">Cliente e borda</text>
  <text class="label" x="366" y="150">Camada da loja</text>
  <text class="label" x="766" y="150">Assíncrono</text>
  <text class="label" x="1046" y="150">ERP legado</text>

  <rect class="box accent" x="84" y="206" width="172" height="74"/>
  <text class="label" x="124" y="238">Cliente</text>
  <text class="small" x="111" y="260">web / app</text>

  <rect class="box accent" x="84" y="342" width="172" height="74"/>
  <text class="label" x="116" y="374">CDN / Edge</text>
  <text class="small" x="115" y="396">cache público</text>

  <rect class="box accent" x="390" y="188" width="252" height="78"/>
  <text class="label" x="438" y="221">API da Loja / BFF</text>
  <text class="small" x="418" y="244">vitrine, checkout, idempotência</text>

  <rect class="box" x="390" y="318" width="252" height="72"/>
  <text class="label" x="463" y="350">Redis</text>
  <text class="small" x="419" y="372">catálogo, preço, disponibilidade</text>

  <rect class="box data" x="390" y="454" width="252" height="80"/>
  <text class="label" x="444" y="486">MySQL da Loja</text>
  <text class="small" x="413" y="509">read model, pedidos, reservas</text>

  <rect class="box data" x="390" y="568" width="252" height="60"/>
  <text class="label" x="481" y="602">Outbox</text>

  <rect class="box queue" x="774" y="214" width="172" height="74"/>
  <text class="label" x="810" y="246">RabbitMQ</text>
  <text class="small" x="816" y="268">fila + DLQ</text>

  <rect class="box queue" x="774" y="370" width="172" height="84"/>
  <text class="label" x="803" y="404">Worker de</text>
  <text class="label" x="787" y="426">Faturamento</text>

  <rect class="box obs" x="774" y="538" width="172" height="72"/>
  <text class="label" x="797" y="570">Observabilidade</text>
  <text class="small" x="803" y="592">logs, métricas, traces</text>

  <rect class="box erp" x="1044" y="220" width="166" height="86"/>
  <text class="label" x="1084" y="254">API ERP</text>
  <text class="small" x="1070" y="276">faturamento</text>

  <rect class="box erp" x="1044" y="420" width="166" height="92"/>
  <text class="label" x="1091" y="454">ERP</text>
  <text class="small" x="1067" y="476">estoque, fiscal,</text>
  <text class="small" x="1080" y="494">financeiro</text>

  <rect class="box erp" x="1044" y="568" width="166" height="60"/>
  <text class="label" x="1065" y="602">Sincronizador</text>

  <path class="arrow" d="M170 280 V342"/>
  <path class="arrow" d="M256 379 H390"/>
  <path class="arrow" d="M516 266 V318"/>
  <path class="arrow" d="M516 390 V454"/>
  <path class="arrow" d="M516 534 V568"/>
  <path class="arrow" d="M642 598 H774 V288"/>
  <path class="arrow" d="M860 288 V370"/>
  <path class="arrow" d="M946 412 H1044 V263"/>
  <path class="arrow" d="M1127 306 V420"/>
  <path class="dash" d="M1044 598 H642 V494"/>
  <path class="dash" d="M1044 598 H642 V354"/>
  <path class="dash" d="M642 227 H774 V574"/>
  <path class="dash" d="M946 412 V574"/>
</svg>
